<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Playable_Pushharder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 177.78vw; 
      max-height: 100vh;
      max-width: 56.25vh; 
      overflow: hidden;
      background-color: #111;
      transform: translate3d(0, 0, 0);
    }

    /* Шейк усієї сцени */
    .shake-camera {
      animation: cameraShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes cameraShake {
      10%, 90% { transform: translate3d(-1px, 1px, 0); }
      20%, 80% { transform: translate3d(2px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 3px, 0); }
      40%, 60% { transform: translate3d(4px, -3px, 0); }
    }

    /* Контейнер фонів для плавності переходів і Ken Burns */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.4s ease-out;
      will-change: transform, opacity;
      z-index: 1;
    }

    .bg-layer.active {
      opacity: 1;
      animation: kenBurns 10s ease-in-out infinite alternate;
    }

    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(-2%, -1%); }
    }

    /* Частинки поверх фону */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Верхній текст з анімованою появою */
    .top-text {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      width: 80%;
      max-height: 25%;
      object-fit: contain;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .top-text.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Кнопки з появою (Pop) та зникненням */
    .btn {
      position: absolute;
      left: 50%;
      width: 65%;
      cursor: pointer;
      z-index: 5;
      display: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-tap-highlight-color: transparent;
    }

    .btn.pop-in {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .btn.fade-out {
      opacity: 0 !important;
      transform: translate(-50%, -50%) scale(0.8) !important;
      pointer-events: none;
    }

    .btn-action { top: 70%; }
    .btn-cta { top: 75%; }

    /* Анімації пульсації */
    @keyframes pulse-slow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.15); }
    }
    @keyframes pulse-medium {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.2); }
    }
    @keyframes pulse-fast {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); filter: brightness(1.25); }
    }

    .pulse-1.pop-in { animation: pulse-slow 1.6s infinite ease-in-out; }
    .pulse-2.pop-in { animation: pulse-medium 1.1s infinite ease-in-out; }
    .pulse-3.pop-in { animation: pulse-fast 0.7s infinite ease-in-out; }

    /* CTA Glow та Sparkle (Блиск) */
    .cta-container {
      position: absolute;
      top: 75%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65%;
      z-index: 5;
      display: none;
    }

    #btn-cta {
      position: relative;
      left: 0;
      top: 0;
      width: 100%;
      transform: none;
      display: block;
      opacity: 1;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
      animation: ctaGlow 2s infinite alternate ease-in-out;
    }

    @keyframes ctaGlow {
      0% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4)); transform: scale(1); }
      100% { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9)); transform: scale(1.05); }
    }

    /* Ефект Блиску поверх CTA */
    .sparkle-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      border-radius: 12px;
    }

    .sparkle-overlay::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        60deg, 
        rgba(255, 255, 255, 0) 20%, 
        rgba(255, 255, 255, 0.8) 50%, 
        rgba(255, 255, 255, 0) 80%
      );
      transform: rotate(25deg);
      animation: sparkleSweep 3s infinite ease-in-out;
    }

    @keyframes sparkleSweep {
      0% { left: -150%; }
      30%, 100% { left: 150%; }
    }

    .btn:active, .cta-container:active {
      transform: translate(-50%, -50%) scale(0.92) !important;
      filter: brightness(1.3) !important;
    }

    /* Покращений Overlay (Градієнт + Blur) */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #overlay.active { opacity: 1; }

    /* Ефект Flash (Спалах) */
    #flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: #fff;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }
    .flash-active {
      animation: flashAnim 0.25s ease-out;
    }
    @keyframes flashAnim {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }

    /* Кнопка вимкнення звуку */
    #sound-toggle {
      position: absolute;
      top: 15px; right: 15px;
      width: 40px; height: 40px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      z-index: 20;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease;
    }
    #sound-toggle:active { transform: scale(0.9); }
    #sound-toggle svg { width: 20px; height: 20px; fill: #ffffff; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="flash"></div>

    <div id="sound-toggle" aria-label="Toggle Sound">
      <svg id="sound-on-icon" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="sound-off-icon" viewBox="0 0 24 24" style="display: none;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </div>

    <img id="bg1" class="bg-layer active" src="assets/bg1.webp" alt="Background">
    <img id="bg2" class="bg-layer" src="" alt="Background">

    <canvas id="particles-canvas"></canvas>

    <img id="top-text" class="top-text show" src="assets/text_start.webp" alt="Header">

    <div id="overlay"></div>

    <img id="btn1" class="btn btn-action pulse-1 pop-in" src="assets/btn1.webp">
    <img id="btn2" class="btn btn-action pulse-2" src="assets/btn2.webp">
    <img id="btn3" class="btn btn-action pulse-3" src="assets/btn2.webp">
    
    <div id="cta-container" class="cta-container">
      <img id="btn-cta" class="btn-cta" src="assets/btn_cta.webp">
      <div class="sparkle-overlay"></div>
    </div>
  </div>

  <audio id="bg-music" src="assets/bg_music.mp3" loop></audio>
  <audio id="sfx-shout1" src="assets/shout1.m4a"></audio>
  <audio id="sfx-shout2" src="assets/shout2.m4a"></audio>
  <audio id="sfx-shout3" src="assets/shout3.m4a"></audio>

  <script>
    // Предзавантаження зображень
    const bgImages = [
      'assets/bg1.webp', 'assets/bg2.webp', 'assets/bg3.webp',
      'assets/bg4.webp', 'assets/bg5.webp', 'assets/bg6.webp'
    ];
    bgImages.forEach(src => { (new Image()).src = src; });

    // Елементи DOM
    const container = document.getElementById('game-container');
    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');
    const topText = document.getElementById('top-text');
    const overlay = document.getElementById('overlay');
    const flash = document.getElementById('flash');

    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');
    const btn3 = document.getElementById('btn3');
    const ctaContainer = document.getElementById('cta-container');

    const bgMusic = document.getElementById('bg-music');
    const shout1 = document.getElementById('sfx-shout1');
    const shout2 = document.getElementById('sfx-shout2');
    const shout3 = document.getElementById('sfx-shout3');

    let activeBgIndex = 1;

    // Плавний перехід фонів (Fade + Zoom)
    function changeBackground(newSrc) {
      const activeLayer = activeBgIndex === 1 ? bg1 : bg2;
      const nextLayer = activeBgIndex === 1 ? bg2 : bg1;

      nextLayer.src = newSrc;
      nextLayer.classList.add('active');
      activeLayer.classList.remove('active');

      activeBgIndex = activeBgIndex === 1 ? 2 : 1;
    }

    // Ефект Flash (Спалах)
    function triggerFlash() {
      flash.classList.remove('flash-active');
      void flash.offsetWidth; 
      flash.classList.add('flash-active');
    }

    // Легкий Shake камери
    function triggerCameraShake() {
      container.classList.remove('shake-camera');
      void container.offsetWidth;
      container.classList.add('shake-camera');
    }

    // Плавна зміна/поява кнопок (Pop in & Fade out)
    function showButton(btn) {
      btn.style.display = 'block';
      setTimeout(() => btn.classList.add('pop-in'), 20);
    }

    function hideButton(btn) {
      btn.classList.remove('pop-in');
      btn.classList.add('fade-out');
      setTimeout(() => {
        btn.style.display = 'none';
        btn.classList.remove('fade-out');
      }, 300);
    }

    // Звукове керування
    const soundToggle = document.getElementById('sound-toggle');
    const soundOnIcon = document.getElementById('sound-on-icon');
    const soundOffIcon = document.getElementById('sound-off-icon');
    let isMuted = false;

    soundToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      [bgMusic, shout1, shout2, shout3].forEach(a => a.muted = isMuted);
      soundOnIcon.style.display = isMuted ? 'none' : 'block';
      soundOffIcon.style.display = isMuted ? 'block' : 'none';
    });

    // Логіка кроків гри
    btn1.addEventListener('click', () => {
      triggerFlash();
      hideButton(btn1);
      
      topText.classList.remove('show');

      bgMusic.volume = 0.4;
      bgMusic.play().catch(() => {});

      changeBackground('assets/bg2.webp');

      playAudio(shout1, () => {
        triggerCameraShake();
        changeBackground('assets/bg3.webp');
        showButton(btn2);
      });
    });

    btn2.addEventListener('click', () => {
      triggerFlash();
      hideButton(btn2);

      changeBackground('assets/bg4.webp');

      playAudio(shout2, () => {
        triggerCameraShake();
        changeBackground('assets/bg5.webp');
        showButton(btn3);
      });
    });

    btn3.addEventListener('click', () => {
      triggerFlash();
      hideButton(btn3);

      changeBackground('assets/bg6.webp');

      playAudio(shout3, () => {
        triggerCameraShake();
        topText.src = 'assets/text_final.webp';
        topText.classList.add('show');
        overlay.classList.add('active');
        
        ctaContainer.style.display = 'block';
        setTimeout(() => ctaContainer.style.opacity = '1', 20);
      });
    });

    ctaContainer.addEventListener('click', () => {
      if (typeof mraid !== 'undefined' && mraid.open) {
        mraid.open('https://hanimax.com/serials/backseat-trip-with-my-stepmother/1');
      } else {
        window.open('https://hanimax.com/serials/backseat-trip-with-my-stepmother/1', '_self');
      }
    });

    function playAudio(audioElement, onEndedCallback) {
      audioElement.currentTime = 0;
      audioElement.play().catch(() => { if (onEndedCallback) onEndedCallback(); });
      audioElement.onended = () => { if (onEndedCallback) onEndedCallback(); };
    }

    // Генерація плаваючих частинок поверх сцени
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 20;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 25; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
