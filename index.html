<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Playable_Car_Ride</title>
  <style>
    :root {
      --ease-out-back: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-in-out-cinematic: cubic-bezier(0.77, 0, 0.175, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ОСНОВНИЙ В'ЮПОРТ */
    #game-viewport {
      position: relative;
      width: 100vw;
      height: 177.78vw; 
      max-height: 100vh;
      max-width: 56.25vh; 
      overflow: hidden;
      background-color: #050505;
      contain: strict;
    }

    /* ЗОВНІШНІЙ КОНТЕЙНЕР (Захист від голих країв) */
    #car-rig-scaler {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scale(1.15);
      transform-origin: center center;
    }

    /* ВНУТРІШНІЙ КОНТЕЙНЕР ПІДВІСКИ ТА АНІМАЦІЇ */
    #car-rig {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    /* ІМІТАЦІЯ ВІБРАЦІЇ МОТОРА */
    .car-driving-idle {
      animation: carEngineVibration 0.12s infinite alternate linear;
    }

    @keyframes carEngineVibration {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(0.5px, -1.2px, 0) rotate(0.1deg); }
      100% { transform: translate3d(-0.5px, 0.8px, 0) rotate(-0.1deg); }
    }

    /* ШАРИ СЦЕНИ З ЕФЕКТОМ KEN BURNS */
    .scene-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      will-change: opacity, transform;
      transition: opacity 0.5s var(--ease-in-out-cinematic);
      z-index: 1;
      
      animation: kenBurnsLoop 20s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    .scene-layer.active {
      opacity: 1;
      z-index: 2;
    }

    @keyframes kenBurnsLoop {
      0% {
        transform: scale(1) translate3d(0, 0, 0);
      }
      50% {
        transform: scale(1.12) translate3d(-1.5%, -1%, 0);
      }
      100% {
        transform: scale(1.06) translate3d(1.5%, 1%, 0);
      }
    }

    /* CANVAS ДЛЯ ПАРТІКЛІВ */
    #fx-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
      z-index: 5;
      pointer-events: none;
    }

    /* UI & BUTTONS */
    .ui-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8% 5%;
      pointer-events: none;
    }

    .top-title {
      width: 85%;
      max-height: 25%;
      object-fit: contain;
      opacity: 0;
      transform: translate3d(0, -30px, 0) scale(0.9);
      transition: opacity 0.5s ease, transform 0.5s var(--ease-out-back);
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
    }

    .top-title.visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .top-title.final-position {
      margin-top: 55%;
    }

    .action-btn {
      position: absolute;
      bottom: 22%;
      width: 68%;
      max-width: 280px;
      cursor: pointer;
      pointer-events: auto;
      opacity: 0;
      transform: translate3d(0, 40px, 0) scale(0.8);
      transition: opacity 0.4s ease, transform 0.4s var(--ease-out-back);
      will-change: transform;
    }

    .action-btn.visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .action-btn:active {
      transform: scale(0.9) !important;
    }

    .btn-pulse {
      animation: btnPulse 1.8s infinite ease-in-out;
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 15px rgba(255,215,0,0.5)); }
    }

    /* CTA КОНТЕЙНЕРИ ТА 4s ЦИКЛ (Idle -> Glow -> Bounce -> Idle -> Shine -> Idle) */
    .cta-wrapper {
      position: absolute;
      bottom: 18%;
      width: 72%;
      max-width: 300px;
      opacity: 0;
      pointer-events: auto;
      transform: translate3d(0, 30px, 0) scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s var(--ease-out-back);
      display: none;
      overflow: hidden;
      border-radius: 50px;
    }

    .cta-wrapper.visible {
      display: block;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      animation: ctaMasterSequence 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cta-wrapper:active {
      transform: scale(0.92) !important;
    }

    .btn-cta {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 50px;
      will-change: transform, filter;
      cursor: pointer;
    }

    /* ЕФЕКТ SHINE (Світлова смуга) */
    .cta-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -120%;
      width: 60%;
      height: 200%;
      background: linear-gradient(
        60deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.2) 20%, 
        rgba(255, 255, 255, 0.85) 50%, 
        rgba(255, 255, 255, 0.2) 80%, 
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      pointer-events: none;
      opacity: 0;
    }

    .cta-wrapper.visible::after {
      animation: ctaShineSequence 4s infinite linear;
    }

    @keyframes ctaMasterSequence {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      }
      /* --- GLOW --- */
      15% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
      }
      25% {
        transform: scale(1);
        filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.4));
      }
      /* --- BOUNCE --- */
      33% {
        transform: scale(1.08, 0.94) translate3d(0, -6px, 0);
        filter: drop-shadow(0 12px 20px rgba(255, 215, 0, 0.7));
      }
      40% {
        transform: scale(0.96, 1.04) translate3d(0, 2px, 0);
      }
      46% {
        transform: scale(1.02, 0.98) translate3d(0, -2px, 0);
      }
      52% {
        transform: scale(1) translate3d(0, 0, 0);
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      }
      /* --- IDLE --- */
      62% {
        transform: scale(1);
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      }
      /* --- SHINE ACCENT --- */
      72% {
        transform: scale(1.02);
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.6));
      }
      82% {
        transform: scale(1);
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      }
      /* --- IDLE --- */
      100% {
        transform: scale(1);
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      }
    }

    @keyframes ctaShineSequence {
      0%, 63% {
        left: -120%;
        opacity: 0;
      }
      65% {
        opacity: 1;
      }
      80% {
        left: 140%;
        opacity: 1;
      }
      82%, 100% {
        left: 140%;
        opacity: 0;
      }
    }

    /* FLASH EFFECT (dark impact) */
    #flash-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: #000;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
    }

    /* MUTE BUTTON */
    #sound-control {
      position: absolute;
      top: 18px; right: 18px;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      z-index: 30;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    #sound-control svg { width: 20px; height: 20px; fill: #fff; }
  </style>
</head>
<body>

  <div id="game-viewport">
    
    <div id="car-rig-scaler">
      <div id="car-rig" class="car-driving-idle">
        <img id="bg-layer-a" class="scene-layer active" src="assets/bg1.webp" alt="Car Scene A">
        <img id="bg-layer-b" class="scene-layer" src="" alt="Car Scene B">
      </div>
    </div>

    <!-- Canvas для частинок (партліків) -->
    <canvas id="fx-canvas"></canvas>
    <div class="vignette"></div>
    <div id="flash-overlay"></div>

    <div class="ui-container">
      <img id="top-title" class="top-title visible" src="assets/text_start.webp" alt="Title">

      <!-- ПЕРША КНОПКА ТЕПЕР ОГОРНУТА У CTA-WRAPPER -->
      <div id="wrapper-step-1" class="cta-wrapper visible">
        <img id="btn-step-1" class="btn-cta" src="assets/btn1.webp" alt="Push Harder">
      </div>

      <img id="btn-step-2" class="action-btn btn-pulse" src="assets/btn2.webp" alt="Push Harder" style="display:none;">
      <img id="btn-step-3" class="action-btn btn-pulse" src="assets/btn2.webp" alt="Push Harder" style="display:none;">

      <div id="cta-wrapper" class="cta-wrapper">
        <img id="btn-cta" class="btn-cta" src="assets/btn_cta.webp" alt="Play Now">
      </div>
    </div>

    <div id="sound-control">
      <svg id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </div>
  </div>

  <script>
    // MRAID Helper
    const MRAID = {
      isAvailable: () => typeof mraid !== 'undefined',
      openStore: (url) => {
        if (typeof mraid !== 'undefined' && typeof mraid.open === 'function') {
          mraid.open(url);
        } else {
          window.location.href = url;
        }
      }
    };

    // СИСТЕМА ПАРТІКЛІВ
    class ParticleSystem {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
      }

      resize() {
        this.canvas.width = this.canvas.clientWidth;
        this.canvas.height = this.canvas.clientHeight;
      }

      spawnParticles(count = 20) {
        for (let i = 0; i < count; i++) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * this.canvas.height,
            size: Math.random() * 3 + 1,
            speedX: (Math.random() - 0.5) * 2,
            speedY: Math.random() * 3 + 1,
            alpha: Math.random() * 0.7 + 0.3,
            color: Math.random() > 0.3 ? 'rgba(255, 215, 0,' : 'rgba(255, 255, 255,'
          });
        }
      }

      animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.particles.length - 1; i >= 0; i--) {
          let p = this.particles[i];
          p.x += p.speedX;
          p.y += p.speedY;
          p.alpha -= 0.01;

          if (p.alpha <= 0) {
            this.particles.splice(i, 1);
            continue;
          }

          this.ctx.fillStyle = p.color + p.alpha + ')';
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          this.ctx.fill();
        }

        requestAnimationFrame(() => this.animate());
      }
    }

    // АУДІО МЕНЕДЖЕР
    class AudioManager {
      constructor() {
        this.isMuted = false;
        this.bgMusic = new Audio('assets/bg_music.mp3');
        this.bgMusic.loop = true;
        this.bgMusic.volume = 0;

        this.sfx = {
          shout1: new Audio('assets/shout1.mp3'),
          shout2: new Audio('assets/shout2.mp3'),
          shout3: new Audio('assets/shout3.mp3')
        };
      }

      playMusicWithFade(targetVolume = 0.4, duration = 1000) {
        if (this.isMuted) return;
        this.bgMusic.play().catch(() => {});
        let start = performance.now();
        const fade = (now) => {
          let progress = Math.min((now - start) / duration, 1);
          this.bgMusic.volume = progress * targetVolume;
          if (progress < 1) requestAnimationFrame(fade);
        };
        requestAnimationFrame(fade);
      }

      playSFX(key) {
        if (this.isMuted || !this.sfx[key]) return;
        const sound = this.sfx[key].cloneNode();
        sound.volume = 0.85;
        sound.play().catch(() => {});
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        this.bgMusic.muted = this.isMuted;
        Object.values(this.sfx).forEach(s => s.muted = this.isMuted);
        return this.isMuted;
      }
    }

    // КОНТРОЛЕР ПІДВІСКИ ТА СТРИБКА
    class CarSuspensionController {
      constructor(carRig, particleSystem) {
        this.rig = carRig;
        this.particleSystem = particleSystem;
      }

      triggerBumpImpact(power = 'medium') {
        const settings = {
          light: { compress: 12, bounceUp: -25, duration: 400, scaleX: 1.03, scaleY: 0.96 },
          medium: { compress: 20, bounceUp: -35, duration: 500, scaleX: 1.05, scaleY: 0.94 },
          heavy: { compress: 28, bounceUp: -48, duration: 600, scaleX: 1.07, scaleY: 0.92 }
        };

        const cfg = settings[power] || settings.medium;
        this.rig.classList.remove('car-driving-idle');

        this.particleSystem.spawnParticles(35);

        let startTime = performance.now();

        const animateBump = (now) => {
          let elapsed = now - startTime;
          let progress = elapsed / cfg.duration;

          if (progress < 0.25) {
            let p = progress / 0.25;
            let y = p * cfg.compress;
            this.rig.style.transform = `translate3d(0, ${y}px, 0) scale(${1 + (cfg.scaleX - 1) * p}, ${1 - (1 - cfg.scaleY) * p})`;
          } 
          else if (progress < 0.6) {
            let p = (progress - 0.25) / 0.35;
            let y = cfg.compress + p * (cfg.bounceUp - cfg.compress);
            let rot = (Math.random() - 0.5) * 3;
            this.rig.style.transform = `translate3d(0, ${y}px, 0) rotate(${rot}deg) scale(${cfg.scaleY}, ${cfg.scaleX})`;
          } 
          else if (progress < 1) {
            let p = (progress - 0.6) / 0.4;
            let y = cfg.bounceUp * (1 - p);
            this.rig.style.transform = `translate3d(0, 0, 0) scale(1, 1)`;
            this.rig.classList.add('car-driving-idle');
            return;
          }

          requestAnimationFrame(animateBump);
        };

        requestAnimationFrame(animateBump);
      }
    }

    // МЕНЕДЖЕР СЦЕНИ
    class SceneManager {
      constructor() {
        this.audio = new AudioManager();
        this.particles = new ParticleSystem(document.getElementById('fx-canvas'));
        this.carController = new CarSuspensionController(document.getElementById('car-rig'), this.particles);

        this.layerA = document.getElementById('bg-layer-a');
        this.layerB = document.getElementById('bg-layer-b');
        this.activeLayer = this.layerA;

        this.flash = document.getElementById('flash-overlay');
        this.title = document.getElementById('top-title');

        this.wrapperStep1 = document.getElementById('wrapper-step-1');
        this.btn1 = document.getElementById('btn-step-1');
        this.btn2 = document.getElementById('btn-step-2');
        this.btn3 = document.getElementById('btn-step-3');
        this.ctaWrapper = document.getElementById('cta-wrapper');

        this.bindEvents();
      }

      triggerFlash(intensity = 0.35) {
        this.flash.style.transition = 'opacity 80ms ease-out';
        this.flash.style.opacity = String(intensity);

        setTimeout(() => {
          this.flash.style.transition = 'opacity 300ms ease-out';
          this.flash.style.opacity = '0';
        }, 90);
      }

      crossFadeTo(newSrc, onComplete) {
        const nextLayer = (this.activeLayer === this.layerA) ? this.layerB : this.layerA;

        const imgLoader = new Image();
        imgLoader.src = newSrc;

        imgLoader.onload = () => {
          nextLayer.src = newSrc;
          nextLayer.classList.add('active');
          this.activeLayer.classList.remove('active');
          this.activeLayer = nextLayer;
          
          if (onComplete) setTimeout(onComplete, 450);
        };

        if (imgLoader.complete) {
          imgLoader.onload = null;
          nextLayer.src = newSrc;
          nextLayer.classList.add('active');
          this.activeLayer.classList.remove('active');
          this.activeLayer = nextLayer;
          
          if (onComplete) setTimeout(onComplete, 450);
        }
      }

      bindEvents() {
        const soundBtn = document.getElementById('sound-control');
        soundBtn.addEventListener('click', () => {
          const isMuted = this.audio.toggleMute();
          document.getElementById('icon-sound-on').style.display = isMuted ? 'none' : 'block';
          document.getElementById('icon-sound-off').style.display = isMuted ? 'block' : 'none';
        });

        // КРОК 1
        this.wrapperStep1.addEventListener('click', () => {
          this.wrapperStep1.style.display = 'none';
          this.title.classList.remove('visible');

          this.audio.playMusicWithFade();
          this.triggerFlash();
          this.carController.triggerBumpImpact('light');

          this.crossFadeTo('assets/bg3.webp', () => {
            this.audio.playSFX('shout1');
            this.btn2.style.display = 'block';
            setTimeout(() => this.btn2.classList.add('visible'), 20);
          });
        });

        // КРОК 2
        this.btn2.addEventListener('click', () => {
          this.btn2.style.display = 'none';

          this.triggerFlash();
          this.carController.triggerBumpImpact('medium');

          this.crossFadeTo('assets/bg5.webp', () => {
            this.audio.playSFX('shout2');
            this.btn3.style.display = 'block';
            setTimeout(() => this.btn3.classList.add('visible'), 20);
          });
        });

        // КРОК 3
        this.btn3.addEventListener('click', () => {
          this.btn3.style.display = 'none';

          this.triggerFlash();
          this.carController.triggerBumpImpact('heavy');

          this.crossFadeTo('assets/bg6.webp', () => {
            this.audio.playSFX('shout3');

            this.title.src = 'assets/text_final.webp';
            this.title.classList.add('final-position', 'visible');

            this.ctaWrapper.classList.add('visible');
          });
        });

        // CTA 
        this.ctaWrapper.addEventListener('click', () => {
          MRAID.openStore('https://hanimax.com/serials/backseat-trip-with-my-stepmother/1');
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.playableApp = new SceneManager();
    });
  </script>
</body>
</html>
