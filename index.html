<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Playable_Pushharder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 177.78vw; 
      max-height: 100vh;
      max-width: 56.25vh; 
      overflow: hidden;
      background-color: #111;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s ease;
      z-index: 1;
    }

    .top-text {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-height: 25%;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* Кнопка вимкнення звуку */
    #sound-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      z-index: 10;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #sound-toggle:active {
      transform: scale(0.9);
    }

    #sound-toggle svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .btn {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65%;
      cursor: pointer;
      z-index: 4;
      display: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action {
      top: 70%;
    }

    .btn-cta {
      top: 75%;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #overlay.active {
      opacity: 1;
    }

    /* Анімації пульсації різної швидкості */
    @keyframes pulse-slow {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.15); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes pulse-medium {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes pulse-fast {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); filter: brightness(1.25); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .pulse-1 { animation: pulse-slow 1.6s infinite ease-in-out; }
    .pulse-2 { animation: pulse-medium 1.1s infinite ease-in-out; }
    .pulse-3 { animation: pulse-fast 0.7s infinite ease-in-out; }

    .btn:active {
      transform: translate(-50%, -50%) scale(0.92) !important;
      filter: brightness(1.3) !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Кнопка перемикання звуку (SVG іконки динамічно змінюються) -->
    <div id="sound-toggle" aria-label="Toggle Sound">
      <svg id="sound-on-icon" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="sound-off-icon" viewBox="0 0 24 24" style="display: none;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </div>

    <!-- Фони -->
    <img id="bg" class="bg-image" src="assets/bg1.png" alt="Background">

    <!-- Текст зверху -->
    <img id="top-text" class="top-text" src="assets/text_start.png" alt="Header">

    <!-- Затемнення кадру -->
    <div id="overlay"></div>

    <!-- Кнопки кроків -->
    <img id="btn1" class="btn btn-action pulse-1" src="assets/btn1.png" style="display: block;">
    <img id="btn2" class="btn btn-action pulse-2" src="assets/btn2.png">
    <img id="btn3" class="btn btn-action pulse-3" src="assets/btn2.png">
    
    <!-- Фінальна кнопка переходу -->
    <img id="btn-cta" class="btn btn-cta pulse-2" src="assets/btn_cta.png">
  </div>

  <!-- Аудіо ефекти -->
  <audio id="bg-music" src="assets/bg_music.mp3" loop></audio>
  <audio id="sfx-shout1" src="assets/shout1.m4a"></audio>
  <audio id="sfx-shout2" src="assets/shout2.m4a"></audio>
  <audio id="sfx-shout3" src="assets/shout3.m4a"></audio>

  <script>
    const bgImages = [
      'assets/bg1.png', 'assets/bg2.png', 'assets/bg3.png',
      'assets/bg4.png', 'assets/bg5.png', 'assets/bg6.png'
    ];
    bgImages.forEach(src => {
      const img = new Image();
      img.src = src;
    });

    // Посилання на елементи
    const bg = document.getElementById('bg');
    const topText = document.getElementById('top-text');
    const overlay = document.getElementById('overlay');

    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');
    const btn3 = document.getElementById('btn3');
    const btnCta = document.getElementById('btn-cta');

    const bgMusic = document.getElementById('bg-music');
    const shout1 = document.getElementById('sfx-shout1');
    const shout2 = document.getElementById('sfx-shout2');
    const shout3 = document.getElementById('sfx-shout3');

    // Керування звуком
    const soundToggle = document.getElementById('sound-toggle');
    const soundOnIcon = document.getElementById('sound-on-icon');
    const soundOffIcon = document.getElementById('sound-off-icon');
    let isMuted = false;

    soundToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      
      // Синхронізуємо стан muted для всіх аудіо елементів
      bgMusic.muted = isMuted;
      shout1.muted = isMuted;
      shout2.muted = isMuted;
      shout3.muted = isMuted;

      // Перемикаємо іконку
      if (isMuted) {
        soundOnIcon.style.display = 'none';
        soundOffIcon.style.display = 'block';
      } else {
        soundOnIcon.style.display = 'block';
        soundOffIcon.style.display = 'none';
      }
    });

    btn1.addEventListener('click', () => {
      btn1.style.display = 'none';
      topText.style.display = 'none'; 
      
      bgMusic.volume = 0.4;
      bgMusic.play().catch(() => {});

      bg.src = 'assets/bg2.png';

      playAudio(shout1, () => {
        bg.src = 'assets/bg3.png';
        btn2.style.display = 'block'; 
      });
    });

    btn2.addEventListener('click', () => {
      btn2.style.display = 'none';

      bg.src = 'assets/bg4.png';

      playAudio(shout2, () => {
        bg.src = 'assets/bg5.png';
        btn3.style.display = 'block'; 
      });
    });

    btn3.addEventListener('click', () => {
      btn3.style.display = 'none';

      bg.src = 'assets/bg6.png';

      playAudio(shout3, () => {
        topText.src = 'assets/text_final.png'; 
        topText.style.display = 'block';       
        overlay.classList.add('active');       
        btnCta.style.display = 'block';        
      });
    });

    btnCta.addEventListener('click', () => {
      if (typeof mraid !== 'undefined' && mraid.open) {
        mraid.open('https://hanimax.com/serials/backseat-trip-with-my-stepmother/1');
      } else {
        window.open('https://hanimax.com/serials/backseat-trip-with-my-stepmother/1', '_self');
      }
    });

    function playAudio(audioElement, onEndedCallback) {
      audioElement.currentTime = 0;
      audioElement.play().catch(() => {
        if (onEndedCallback) onEndedCallback();
      });

      audioElement.onended = () => {
        if (onEndedCallback) onEndedCallback();
      };
    }
  </script>
</body>
</html>
